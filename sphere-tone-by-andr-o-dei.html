<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Круг-слайдер</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background-color: black; /* черный фон */
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .circle {
      background-color: white; /* белый круг */
      border-radius: 50%;
      transition: width 0.2s, height 0.2s;
    }

    .slider-wrapper {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
    }

    input[type=range] {
      width: 300px;
      appearance: none;
      height: 6px;
      background: white;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 20px;
      height: 20px;
      background: black; /* черный бегунок */
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid white;
    }

    input[type=range]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: black;
      border-radius: 50%;
      border: 2px solid white;
      cursor: pointer;
    }

    /* Линии поверх макета */
    .overlay-lines {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none; /* чтобы не мешать кликам */
    }

    .top-lines {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      margin-bottom: 100px; /* расстояние до нижней линии */
    }

    .line {
      width: 200px;
      height: 20px;
      background: black;
      transform-origin: center;
      transition: transform 0.1s linear;
    }

    .gap {
      width: 50px; /* разрыв */
      height: 20px;
    }
  </style>
</head>
<body>

  <div id="circle" class="circle" style="width: 150px; height: 150px;"></div>

  <!-- Линии поверх всего -->
  <div class="overlay-lines">
    <div class="top-lines">
      <div id="lineLeft" class="line"></div>
      <div class="gap"></div>
      <div id="lineRight" class="line"></div>
    </div>
    <div id="lineBottom" class="line"></div>
  </div>

  <div class="slider-wrapper">
    <input type="range" id="sizeSlider" min="50" max="400" value="150">
  </div>

  <script>
    const circle = document.getElementById('circle');
    const slider = document.getElementById('sizeSlider');
    const lineLeft = document.getElementById('lineLeft');
    const lineRight = document.getElementById('lineRight');

    // Инициализация Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let oscillator = null;

    slider.addEventListener('input', () => {
      const size = slider.value;
      circle.style.width = `${size}px`;
      circle.style.height = `${size}px`;

      // создаем или обновляем звук
      if (!oscillator) {
        oscillator = audioCtx.createOscillator();
        oscillator.type = "sine";
        oscillator.connect(audioCtx.destination);
        oscillator.start();
      }

      // меняем частоту от 200 до 1000 Гц
      const freq = 200 + (slider.value - 50) * 2;
      oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);

      // угол наклона верхних линий (от 0° до 20°)
      const angle = ((slider.value - 225) / 175) * 20;

      // Левая линия: край (левый) вниз, внутренний край (правый) вверх
      lineLeft.style.transformOrigin = "right center";
      lineLeft.style.transform = `rotate(${angle}deg)`;

      // Правая линия: край (правый) вниз, внутренний край (левый) вверх
      lineRight.style.transformOrigin = "left center";
      lineRight.style.transform = `rotate(${-angle}deg)`;
    });

    // Отключение звука, если пользователь отпустил слайдер
    slider.addEventListener('change', () => {
      if (oscillator) {
        oscillator.stop();
        oscillator.disconnect();
        oscillator = null;
      }
    });
  </script>

</body>
</html>
