<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Круг-слайдер + линии</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background-color: black; /* черный фон */
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .circle {
      background-color: white; /* белый круг */
      border-radius: 50%;
      transition: width 0.2s, height 0.2s;
      margin-bottom: 100px; /* чтобы линии были выше */
    }

    .lines {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 150px;
    }

    .line {
      width: 200px;
      height: 20px;
      background: black;
      position: relative;
      transform-origin: center;
      margin: 25px 0;
      transition: transform 0.1s linear;
    }

    .slider-wrapper {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
    }

    input[type=range] {
      width: 300px;
      appearance: none;
      height: 6px;
      background: white;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      appearance: none;
      width: 20px;
      height: 20px;
      background: black; /* черный бегунок */
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid white;
    }

    input[type=range]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: black;
      border-radius: 50%;
      border: 2px solid white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="circle" class="circle" style="width: 150px; height: 150px;"></div>

  <!-- Блок линий -->
  <div class="lines">
    <div id="line1" class="line"></div>
    <div id="line2" class="line"></div>
    <div style="height:200px"></div> <!-- расстояние до нижней линии -->
    <div id="line3" class="line"></div>
  </div>

  <div class="slider-wrapper">
    <input type="range" id="sizeSlider" min="50" max="400" value="150">
  </div>
